[package]
name = "lightship"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/pintlehq/lightship"
publish = false

[dependencies]
pintle-gpui-kit = { git = "https://github.com/pintlehq/pintle-gpui-kit", rev = "2da5d9b7c485a46b3a2d49907bc36be4819ee252", features = ["shell", "assets"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["test-support", "component", "assets"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "limited"
