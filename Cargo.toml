[package]
name = "lightship"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/pintlehq/lightship"
publish = false

[dependencies]
pintle-gpui-kit = { git = "https://github.com/pintlehq/pintle-gpui-kit", rev = "c8a4c6d1cc6c5ff57f8fa9b9ee4d7ef67d459612", features = ["shell", "assets"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["test-support", "component", "assets"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "limited"
